<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icono-192.png">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --texto: #F2F2F2; --suave: #B5B5B5; --apagado: #6F6F6F; --linea: #1E1E1E; --acento: #F5A524; --acento2: #FBBF24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--texto); overflow: hidden;
    font-family: Jost, -apple-system, "Segoe UI", sans-serif; font-weight: 300; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  header { text-align: center; padding: 0 24px; }
  header h1 { margin: 0; font-size: 19px; font-weight: 300; letter-spacing: 12px; margin-right: -12px; color: #CFCFCF; }
  header h1 span { color: var(--acento2); text-shadow: 0 0 10px rgba(251,191,36,.75), 0 0 22px rgba(245,165,36,.4); }
  #linea { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px;
    font-size: 11.5px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--apagado); white-space: nowrap; }
  #linea i { width: 3px; height: 3px; border-radius: 50%; background: var(--acento); opacity: .8; flex: none; }
  #saludo { margin-top: 22px; font-size: 24px; font-weight: 300; letter-spacing: .3px; color: #E8E8E8; }
  #saludo b { font-weight: 300; color: var(--acento2); }

  #escenario { position: relative; flex: 1; min-height: 0; }
  #esfera { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }

  #zona { margin: 0 30px; min-height: 104px; display: flex; flex-direction: column; align-items: center; }
  #frase { display: flex; align-items: center; gap: 14px; font-size: 13.5px; letter-spacing: 2.6px; color: var(--suave); text-align: center; }
  #frase::before { content: ""; width: 1.5px; height: 20px; background: var(--acento); box-shadow: 0 0 8px var(--acento); flex: none; }
  #respuesta { display: none; max-height: 24vh; overflow-y: auto; text-align: center; font-size: 18px; line-height: 1.45;
    -webkit-user-select: text; user-select: text; }
  #respuesta b { color: var(--acento2); font-weight: 400; }
  #respuesta .tu { display: block; font-size: 13px; letter-spacing: 1px; color: var(--apagado); margin-bottom: 8px; }
  #zona.charla #frase { display: none; } #zona.charla #respuesta { display: block; }
  .rayita { width: 60px; height: 1px; margin: 16px auto 9px; background: linear-gradient(90deg, transparent, var(--acento), transparent); }
  #estado { font-size: 10.5px; letter-spacing: 2.6px; color: #4A4A4A; text-transform: uppercase; transition: color .3s; }
  #estado.vivo { color: var(--acento); }

  #pie { display: flex; justify-content: space-between; padding: 6px 22px 0; }
  .redondo { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #222; display: grid; place-items: center;
    color: var(--apagado); background: #070707; }

  #escribir { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 14px); display: none; gap: 8px; z-index: 7; }
  #escribir.abierto { display: flex; }
  #escribir input { flex: 1; background: #0E0E0E; border: 1px solid #2A2A2A; color: var(--texto); border-radius: 22px;
    padding: 13px 16px; font: 400 16px Jost, sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
  #escribir button { width: 46px; border-radius: 50%; background: var(--acento); color: #1A1204; display: grid; place-items: center; }

  #ajustes { position: fixed; inset: 0; background: rgba(0,0,0,.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 22px) 26px calc(env(safe-area-inset-bottom) + 20px); z-index: 8; }
  #ajustes.abierto { transform: none; }
  #ajustes .titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
    font-size: 12px; letter-spacing: 6px; color: var(--apagado); }
  #ajustes .titulo button { letter-spacing: 1px; font-size: 14px; color: var(--suave); }
  .ajuste { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 18px 0;
    border-bottom: 1px solid #161616; font-size: 16px; color: #E5E5E5; text-align: left; }
  .ajuste em { font-style: normal; font-size: 13px; color: var(--apagado); }
  .ajuste em.on { color: var(--acento); }
  .nota { color: #4F4F4F; font-size: 13px; line-height: 1.55; margin-top: 24px; }

  #conectar { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center;
    padding: 32px; gap: 14px; z-index: 9; text-align: center; }
  #conectar.abierto { display: flex; }
  #conectar p { color: var(--suave); line-height: 1.5; margin: 0; }
  #conectar input { background: #111; border: 1px solid #262626; color: var(--texto); border-radius: 14px; padding: 14px;
    font-size: 16px; text-align: center; -webkit-user-select: text; user-select: text; }
  #conectar button { background: var(--acento); color: #1A1204; border-radius: 14px; padding: 14px; font-weight: 500; }

  @media (max-height: 760px) { #saludo { margin-top: 14px; font-size: 21px; } #zona { min-height: 90px; } }
</style>
</head>
<body>
<header>
  <h1>MINISTR<span>O</span></h1>
  <div id="linea"><span id="fechaTxt"></span><i></i><span id="horaTxt"></span><i></i><span id="climaTxt">Barranquilla</span></div>
  <div id="saludo"></div>
</header>

<div id="escenario"><canvas id="esfera" aria-label="Toca para hablar con Ministro"></canvas></div>

<div id="zona">
  <div id="frase"></div>
  <div id="respuesta"></div>
  <div class="rayita"></div>
  <div id="estado">Toca la esfera para hablar</div>
</div>

<div id="pie">
  <button class="redondo" id="abrirAjustes" aria-label="Configuración">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="redondo" id="teclado" aria-label="Escribir">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
  </button>
</div>
<form id="escribir" autocomplete="off">
  <input id="campo" placeholder="Escríbele a Ministro…" enterkeyhint="send">
  <button type="submit" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<section id="ajustes">
  <div class="titulo"><span>CONFIGURACIÓN</span><button id="cerrarAjustes">Cerrar</button></div>
  <button class="ajuste" id="ajusteVoz">Voz de Ministro <em id="ajusteVozTxt"></em></button>
  <button class="ajuste" id="probarVoz">Probar sonido <em>›</em></button>
  <button class="ajuste" id="reconectar">Desconectar este celular <em>›</em></button>
  <p class="nota">Si no se escucha nada en el iPhone, revisa que el botón de silencio del lado no esté en naranja y sube el volumen.</p>
</section>

<section id="conectar">
  <p>Abre el link que te llegó al correo para conectar a Ministro.<br>O pega aquí la clave:</p>
  <input id="campoClave" placeholder="Clave" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button id="guardarClave">Conectar</button>
</section>

<script>
const URL_MINISTRO = "https://qzszwuiehdjndzqfbvsw.supabase.co/functions/v1/ministro";
const $ = (id) => document.getElementById(id);
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ---------- Conexión: el link del correo trae la clave en #k=... (no viaja al servidor de GitHub) ----------
const enlace = new URLSearchParams(location.hash.slice(1)).get("k");
if (enlace) { guardar("clave", enlace); history.replaceState(null, "", location.pathname); }
const clave = () => leer("clave", null);
function pedirConexion() { $("conectar").classList.add("abierto"); }
$("guardarClave").onclick = () => {
  const c = $("campoClave").value.trim();
  if (c) { guardar("clave", c); $("conectar").classList.remove("abierto"); }
};

// ---------- Esfera de partículas con órbitas ----------
const lienzo = $("esfera"), ctx = lienzo.getContext("2d");
let W = 0, H = 0, DPR = 1;
function medir() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = lienzo.clientWidth; H = lienzo.clientHeight;
  lienzo.width = W * DPR; lienzo.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", medir);

const N = 1500, puntos = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
  const j = 1 + (Math.random() - 0.5) * 0.05;
  puntos.push({ x: Math.cos(th) * r * j, y: y * j, z: Math.sin(th) * r * j, fase: Math.random() * 6.283,
    ambar: Math.random() < 0.06, brillo: Math.random() < 0.012 });
}
const ESTADOS = {
  reposo:     { energia: 0.035, giro: 0.12, tam: 1.00, orbita: 0.35, luz: 0.0 },
  escuchando: { energia: 0.20,  giro: 0.30, tam: 1.08, orbita: 0.7,  luz: 0.5 },
  pensando:   { energia: 0.09,  giro: 1.10, tam: 0.95, orbita: 2.6,  luz: 0.7 },
  hablando:   { energia: 0.14,  giro: 0.35, tam: 1.03, orbita: 0.9,  luz: 0.6 },
};
const ORBITAS = [
  { rx: 1.55, ry: 0.42, rot: -0.20, vel: 1.0, chispas: [0.0, 2.2, 3.6] },
  { rx: 1.30, ry: 1.08, rot: 0.55,  vel: -0.7, chispas: [0.8, 3.9] },
];
let modo = "reposo", act = { ...ESTADOS.reposo }, nivelVoz = 0, angulo = 0, giroOrbita = 0, t0 = performance.now();

function orbita(cx, cy, R, o, delante) {
  const rx = R * o.rx, ry = R * o.ry, ini = delante ? 0 : Math.PI, fin = ini + Math.PI;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(o.rot);
  const g = ctx.createLinearGradient(-rx, 0, rx, 0);
  const a = (delante ? 0.55 : 0.22) + act.luz * 0.25 + nivelVoz * 0.2;
  g.addColorStop(0, `rgba(245,165,36,${a * 0.2})`); g.addColorStop(0.5, `rgba(251,191,36,${a})`); g.addColorStop(1, `rgba(245,165,36,${a * 0.2})`);
  ctx.strokeStyle = g; ctx.lineWidth = delante ? 1 : 0.8;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, ini, fin); ctx.stroke();
  for (const c of o.chispas) {
    let ang = (c + giroOrbita * o.vel) % 6.283; if (ang < 0) ang += 6.283;
    if ((ang < Math.PI) !== delante) continue;
    const px = Math.cos(ang) * rx, py = Math.sin(ang) * ry;
    const b = ctx.createRadialGradient(px, py, 0, px, py, 9);
    b.addColorStop(0, "rgba(255,236,190,1)"); b.addColorStop(0.25, "rgba(251,191,36,.75)"); b.addColorStop(1, "rgba(245,165,36,0)");
    ctx.fillStyle = b; ctx.beginPath(); ctx.arc(px, py, 9, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function base(cx, cy, R) {
  const by = cy + R * 1.22;
  ctx.save(); ctx.translate(cx, by); ctx.scale(1, 0.12);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.9);
  g.addColorStop(0, `rgba(251,191,36,${0.55 + act.luz * 0.3})`); g.addColorStop(0.25, "rgba(245,165,36,.18)"); g.addColorStop(1, "rgba(245,165,36,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 0.9, 0, 6.283); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(245,165,36,.22)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx, by, R * 0.72, R * 0.085, 0, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = "rgba(245,165,36,.09)";
  ctx.beginPath(); ctx.ellipse(cx, by + R * 0.04, R * 1.05, R * 0.13, 0, 0, 6.283); ctx.stroke();
  const l = ctx.createLinearGradient(cx - R * 0.45, 0, cx + R * 0.45, 0);
  l.addColorStop(0, "rgba(251,191,36,0)"); l.addColorStop(0.5, "rgba(255,226,160,.95)"); l.addColorStop(1, "rgba(251,191,36,0)");
  ctx.fillStyle = l; ctx.fillRect(cx - R * 0.45, by - 0.8, R * 0.9, 1.6);
}

function cuadro(ahora) {
  const t = (ahora - t0) / 1000, dt = Math.min(0.05, (ahora - (cuadro.prev || ahora)) / 1000); cuadro.prev = ahora;
  const meta = ESTADOS[modo];
  for (const k in act) act[k] += (meta[k] - act[k]) * Math.min(1, dt * 3.5);
  if (modo === "hablando") nivelVoz = Math.max(nivelVoz * 0.92, 0.35 + 0.65 * Math.abs(Math.sin(t * 7.3) * Math.sin(t * 3.1)));
  else nivelVoz *= 0.9;
  angulo += dt * act.giro; giroOrbita += dt * act.orbita;

  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.31, H * 0.36) * act.tam * (1 + 0.02 * Math.sin(t * 1.6));
  const halo = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.7);
  halo.addColorStop(0, `rgba(245,165,36,${0.10 + nivelVoz * 0.12 + act.luz * 0.06})`);
  halo.addColorStop(1, "rgba(245,165,36,0)");
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  base(cx, cy, R);
  for (const o of ORBITAS) orbita(cx, cy, R, o, false);

  const cY = Math.cos(angulo), sY = Math.sin(angulo), inc = -0.3 + 0.08 * Math.sin(t * 0.4), cX = Math.cos(inc), sX = Math.sin(inc);
  const lista = [];
  for (const p of puntos) {
    const ola = act.energia * Math.sin(p.fase + t * (modo === "escuchando" ? 6 : 3) + p.y * 5)
              + (modo === "hablando" ? nivelVoz * 0.15 * Math.sin(p.y * 9 + t * 11) : 0);
    const k = 1 + ola;
    const x = p.x * k, y = p.y * k, z = p.z * k;
    const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
    const y1 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    lista.push([x1, y1, z2, p]);
  }
  lista.sort((a, b) => a[2] - b[2]);
  for (const [x, y, z, p] of lista) {
    const prof = (z + 1) / 2, tam = 0.45 + prof * 1.65, px = cx + x * R, py = cy + y * R;
    if (p.brillo && prof > 0.5) {
      const tw = 0.6 + 0.4 * Math.sin(t * 2 + p.fase);
      const b = ctx.createRadialGradient(px, py, 0, px, py, 8);
      b.addColorStop(0, `rgba(255,230,170,${tw})`); b.addColorStop(1, "rgba(251,191,36,0)");
      ctx.fillStyle = b; ctx.beginPath(); ctx.arc(px, py, 8, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = p.ambar ? `rgba(251,191,36,${0.3 + prof * 0.7})` : `rgba(245,245,245,${0.06 + prof * 0.84})`;
    ctx.beginPath(); ctx.arc(px, py, p.ambar ? tam * 1.3 : tam, 0, 6.283); ctx.fill();
  }
  for (const o of ORBITAS) orbita(cx, cy, R, o, true);
  requestAnimationFrame(cuadro);
}

const REPOSO = "Toca la esfera para hablar";
let volverFrase = null;
function ponerModo(m, texto) {
  modo = m;
  $("estado").textContent = texto;
  $("estado").classList.toggle("vivo", m !== "reposo");
  clearTimeout(volverFrase);
  if (m === "reposo") volverFrase = setTimeout(() => $("zona").classList.remove("charla"), 45000);
}
function mostrarRespuesta(html) {
  $("respuesta").innerHTML = html; $("zona").classList.add("charla");
  $("respuesta").scrollTop = $("respuesta").scrollHeight;
}

// ---------- Texto con lo importante resaltado ----------
const escapar = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const resaltar = (s) => escapar(s).replace(/(\$\s?[\d.,]+|\b\d[\d.,]*\s(?:mil(?:\s(?:pesos))?|pesos|d[ií]as?|horas?|millones|mill[oó]n)\b|\b(?:hoy|mañana)\b)/gi, "<b>$1</b>");

// ---------- Voz: lee frase por frase a medida que llega la respuesta ----------
let conVoz = leer("conVoz", true), vozElegida = null, audioListo = false, porLeer = 0;
function pintarVoz() { $("ajusteVozTxt").textContent = conVoz ? "Encendida" : "Apagada"; $("ajusteVozTxt").classList.toggle("on", conVoz); }
function elegirVoz() {
  const orden = ["es-co", "es-mx", "es-us", "es-419", "es-es"];
  const v = speechSynthesis.getVoices().filter((x) => x.lang.toLowerCase().startsWith("es"));
  v.sort((a, b) => ((orden.indexOf(a.lang.toLowerCase()) + 99) % 99) - ((orden.indexOf(b.lang.toLowerCase()) + 99) % 99));
  vozElegida = v[0] || null;
}
const hayVoz = "speechSynthesis" in window;
if (hayVoz) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

// iPhone: la voz solo arranca después de un toque. Además se reproduce un audio mudo para que el
// teléfono trate la app como "reproduciendo audio" y no la calle el botón de silencio.
function prepararAudio() {
  if (audioListo) return; audioListo = true;
  try {
    const mudo = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=");
    mudo.loop = true; mudo.volume = 0.01; mudo.setAttribute("playsinline", ""); mudo.play().catch(() => {});
  } catch {}
  if (hayVoz) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
}
let terminoRespuesta = true;
function decir(frase) {
  if (!conVoz || !hayVoz || !frase.trim()) return;
  const u = new SpeechSynthesisUtterance(frase.trim());
  u.lang = vozElegida ? vozElegida.lang : "es-CO"; if (vozElegida) u.voice = vozElegida; u.rate = 1.07;
  porLeer++;
  u.onstart = () => ponerModo("hablando", "Hablando");
  u.onboundary = () => { nivelVoz = 1; };
  u.onend = u.onerror = () => { porLeer--; if (porLeer <= 0 && terminoRespuesta) { porLeer = 0; ponerModo("reposo", REPOSO); } };
  speechSynthesis.speak(u);
}
function callar() { if (hayVoz) speechSynthesis.cancel(); porLeer = 0; }

// ---------- Hablar con el cerebro (respuesta en vivo) ----------
let ocupado = false;
async function preguntar(texto) {
  texto = texto.trim();
  if (!texto || ocupado) return;
  if (!clave()) return pedirConexion();
  ocupado = true; terminoRespuesta = false; callar();
  const tu = `<span class="tu">${escapar(texto)}</span>`;
  mostrarRespuesta(tu);
  ponerModo("pensando", "Pensando…");
  let resp = "", leido = 0, error = false;
  try {
    const r = await fetch(URL_MINISTRO, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clave: clave(), texto, stream: true }) });
    if (r.status === 401) { guardar("clave", null); resp = "Perdí la conexión. Abre otra vez el link del correo."; error = true; }
    else if (!r.ok || !r.body) { resp = "Tuve un problema pensando. Intenta otra vez."; error = true; }
    else {
      const lector = r.body.getReader(), dec = new TextDecoder();
      for (;;) {
        const { value, done } = await lector.read();
        if (done) break;
        resp += dec.decode(value, { stream: true });
        mostrarRespuesta(tu + resaltar(resp));
        const corte = Math.max(resp.lastIndexOf(". "), resp.lastIndexOf("? "), resp.lastIndexOf("! "), resp.lastIndexOf(": "));
        if (corte + 1 > leido) { decir(resp.slice(leido, corte + 1)); leido = corte + 1; }
      }
    }
  } catch { if (!resp) { resp = "No me pude conectar. Revisa el internet."; error = true; } }
  ocupado = false; terminoRespuesta = true;
  mostrarRespuesta(tu + resaltar(resp));
  if (!error && leido < resp.length) decir(resp.slice(leido));
  if (error || !conVoz || !hayVoz || porLeer === 0) ponerModo("reposo", REPOSO);
}

// ---------- Escuchar ----------
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false;
if (Reconocer) {
  rec = new Reconocer(); rec.lang = "es-CO"; rec.interimResults = true; rec.continuous = false;
  let final = "";
  rec.onstart = () => { escuchando = true; final = ""; ponerModo("escuchando", "Te escucho…"); };
  rec.onresult = (e) => {
    let parcial = "";
    for (const r of e.results) { if (r.isFinal) final = r[0].transcript; else parcial += r[0].transcript; }
    mostrarRespuesta(`<span class="tu">${escapar(final || parcial)}</span>`);
  };
  rec.onerror = (e) => {
    escuchando = false;
    ponerModo("reposo", e.error === "not-allowed" ? "Activa el micrófono o usa el teclado" : "No te escuché. Toca otra vez");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") abrirTeclado();
  };
  rec.onend = () => { escuchando = false; if (final) preguntar(final); else if (modo === "escuchando") ponerModo("reposo", REPOSO); };
}
lienzo.addEventListener("click", () => {
  prepararAudio();
  if (ocupado) return;
  if (hayVoz && speechSynthesis.speaking) { callar(); ponerModo("reposo", REPOSO); return; }
  if (!rec) { abrirTeclado(); return; }
  if (escuchando) rec.stop(); else { try { rec.start(); } catch {} }
});

// ---------- Teclado ----------
function abrirTeclado() { $("escribir").classList.add("abierto"); $("pie").style.visibility = "hidden"; $("campo").focus(); }
function cerrarTeclado() { $("escribir").classList.remove("abierto"); $("pie").style.visibility = ""; }
$("teclado").onclick = () => { prepararAudio(); abrirTeclado(); };
$("campo").onblur = () => setTimeout(() => { if (!$("campo").value) cerrarTeclado(); }, 150);
$("escribir").onsubmit = (e) => {
  e.preventDefault(); prepararAudio();
  const t = $("campo").value; $("campo").value = ""; $("campo").blur(); cerrarTeclado();
  preguntar(t);
};

// ---------- Configuración ----------
$("abrirAjustes").onclick = () => $("ajustes").classList.add("abierto");
$("cerrarAjustes").onclick = () => $("ajustes").classList.remove("abierto");
$("ajusteVoz").onclick = () => { conVoz = !conVoz; guardar("conVoz", conVoz); pintarVoz(); if (conVoz) prepararAudio(); else callar(); };
$("probarVoz").onclick = () => { prepararAudio(); conVoz = true; guardar("conVoz", true); pintarVoz(); terminoRespuesta = true; decir("Hola Andrés, aquí estoy."); };
$("reconectar").onclick = () => { guardar("clave", null); $("ajustes").classList.remove("abierto"); pedirConexion(); };

// ---------- Clima de Barranquilla (Open-Meteo, sin clave) ----------
function cielo(c) {
  if (c === 0) return "Despejado";
  if (c === 1 || c === 2) return "Parcial";
  if (c === 3) return "Nublado";
  if (c === 45 || c === 48) return "Neblina";
  if (c >= 95) return "Tormenta";
  if (c >= 80) return "Aguaceros";
  if (c >= 61) return "Lluvia";
  if (c >= 51) return "Llovizna";
  return "Nublado";
}
function pintarClima(w) { if (w) $("climaTxt").textContent = `${Math.round(w.temperature_2m)}° ${cielo(w.weather_code)}`; }
async function cargarClima() {
  pintarClima(leer("clima", null));
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=10.9685&longitude=-74.7813&current=temperature_2m,weather_code&timezone=America%2FBogota");
    const d = await r.json(); guardar("clima", d.current); pintarClima(d.current);
  } catch {}
}

// ---------- Fecha, hora, saludo y frase del día ----------
const FRASES = [
  "Un día a la vez, siempre hacia adelante.",
  "Lo que haces hoy cuenta.",
  "Constancia le gana a talento.",
  "Paso a paso se llega lejos.",
  "Termina lo que empezaste.",
  "Tu yo del futuro te lo va a agradecer.",
  "Poco a poco, pero sin parar.",
];
function pintarFecha() {
  const ahora = new Date(), h = ahora.getHours();
  const dia = ahora.toLocaleDateString("es-CO", { weekday: "short" }).replace(".", "");
  const mes = ahora.toLocaleDateString("es-CO", { month: "short" }).replace(".", "");
  $("fechaTxt").textContent = `${dia} ${ahora.getDate()} ${mes}`;
  $("horaTxt").textContent = `${((h + 11) % 12) + 1}:${String(ahora.getMinutes()).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`;
  $("saludo").innerHTML = `${h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches"}, <b>Andrés</b>`;
  const n = Math.floor((ahora - new Date(ahora.getFullYear(), 0, 0)) / 864e5);
  $("frase").textContent = FRASES[n % FRASES.length];
}

medir(); pintarVoz(); pintarFecha(); cargarClima(); requestAnimationFrame(cuadro);
setInterval(pintarFecha, 15000); setInterval(cargarClima, 20 * 60000);
if (!clave()) pedirConexion();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
