<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ministro</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ministro">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<style>
  :root { --texto: #FAFAFA; --suave: #A3A3A3; --apagado: #737373; --linea: #1F1F1F; --acento: #F59E0B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--texto); overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Inter, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 12px); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 16px; }
  header h1 { margin: 0; text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 8px; color: var(--apagado); }
  .icono { width: 44px; height: 44px; display: grid; place-items: center; color: var(--apagado); }
  .icono.activo { color: var(--acento); }
  #saludo { text-align: center; font-size: 13px; color: var(--apagado); margin-top: 2px; }

  #escenario { position: relative; flex: 1; min-height: 0; }
  #esfera { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }

  #estado { text-align: center; font-size: 14px; color: var(--suave); min-height: 20px; transition: color .3s; }
  #estado.vivo { color: var(--acento); }
  #respuesta { margin: 10px 32px 0; min-height: 96px; max-height: 26vh; overflow-y: auto; text-align: center;
    font-size: 20px; line-height: 1.42; font-weight: 300; -webkit-user-select: text; user-select: text; }
  #respuesta b { color: var(--acento); font-weight: 500; }
  #respuesta .tu { display: block; font-size: 14px; color: var(--apagado); margin-bottom: 8px; }

  #barra { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 14px 28px 0; padding-top: 14px; border-top: 1px solid var(--linea); }
  #barra div { font-size: 11px; color: var(--apagado); letter-spacing: .5px; min-width: 0; }
  #barra div:nth-child(2) { text-align: center; } #barra div:nth-child(3) { text-align: right; }
  #barra b { display: block; margin-top: 4px; font-size: 14px; font-weight: 500; color: #E5E5E5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #barra b.alerta { color: var(--acento); }

  #escribir { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    display: none; gap: 8px; }
  #escribir.abierto { display: flex; }
  #escribir input { flex: 1; background: #111; border: 1px solid #262626; color: var(--texto); border-radius: 22px;
    padding: 13px 16px; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text; }
  #escribir button { width: 46px; border-radius: 50%; background: var(--acento); color: #1A1204; display: grid; place-items: center; }

  #teclado { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 86px); width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid #262626; display: grid; place-items: center; color: var(--suave); background: #0A0A0A; }

  #historial { position: fixed; inset: 0; background: rgba(0,0,0,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 14px); z-index: 5; }
  #historial.abierto { transform: none; }
  #historial header { display: flex; justify-content: space-between; padding: 0; margin-bottom: 12px; font-size: 12px; letter-spacing: 6px; color: var(--apagado); }
  #historial header button { letter-spacing: 0; font-size: 15px; color: var(--suave); }
  #lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; user-select: text; }
  #lista p { margin: 0; font-size: 16px; line-height: 1.4; }
  #lista p.tu { color: var(--apagado); font-size: 14px; }
  #lista p b { color: var(--acento); font-weight: 500; }
  .vacio { color: var(--apagado); text-align: center; margin-top: 30vh; }

  #conectar { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center;
    padding: 32px; gap: 14px; z-index: 9; text-align: center; }
  #conectar.abierto { display: flex; }
  #conectar p { color: var(--suave); line-height: 1.5; margin: 0; }
  #conectar input { background: #111; border: 1px solid #262626; color: var(--texto); border-radius: 14px; padding: 14px;
    font-size: 16px; text-align: center; -webkit-user-select: text; user-select: text; }
  #conectar button { background: var(--acento); color: #1A1204; border-radius: 14px; padding: 14px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <button class="icono activo" id="voz" aria-label="Voz encendida">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="ondasVoz" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  </button>
  <h1>MINISTRO</h1>
  <button class="icono" id="abrirHistorial" aria-label="Historial">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
  </button>
</header>
<div id="saludo"></div>

<div id="escenario"><canvas id="esfera" aria-label="Toca para hablar con Ministro"></canvas></div>

<div id="estado">Toca la esfera para hablar</div>
<div id="respuesta"></div>

<div id="barra">
  <div>Hoy<b id="datoHoy">—</b></div>
  <div>Entregas<b id="datoEntrega">—</b></div>
  <div>Saldo<b id="datoSaldo">—</b></div>
</div>

<button id="teclado" aria-label="Escribir">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
</button>
<form id="escribir" autocomplete="off">
  <input id="campo" placeholder="Escríbele a Ministro…" enterkeyhint="send">
  <button type="submit" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<section id="historial">
  <header><span>HISTORIAL</span><span><button id="limpiar">Borrar</button>&nbsp;&nbsp;&nbsp;<button id="cerrarHistorial">Cerrar</button></span></header>
  <div id="lista"></div>
</section>

<section id="conectar">
  <p>Abre el link que te llegó al correo para conectar a Ministro.<br>O pega aquí la clave:</p>
  <input id="campoClave" placeholder="Clave" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button id="guardarClave">Conectar</button>
</section>

<script>
const URL_MINISTRO = "https://qzszwuiehdjndzqfbvsw.supabase.co/functions/v1/ministro";
const $ = (id) => document.getElementById(id);
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ---------- Conexión: el link del correo trae la clave en #k=... (no viaja al servidor de GitHub) ----------
const enlace = new URLSearchParams(location.hash.slice(1)).get("k");
if (enlace) { guardar("clave", enlace); history.replaceState(null, "", location.pathname); }
const clave = () => leer("clave", null);
function pedirConexion() { $("conectar").classList.add("abierto"); }
$("guardarClave").onclick = () => {
  const c = $("campoClave").value.trim();
  if (c) { guardar("clave", c); $("conectar").classList.remove("abierto"); cargarEstado(); }
};

// ---------- Esfera de partículas ----------
const lienzo = $("esfera"), ctx = lienzo.getContext("2d");
let W = 0, H = 0, DPR = 1;
function medir() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = lienzo.clientWidth; H = lienzo.clientHeight;
  lienzo.width = W * DPR; lienzo.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", medir);

const N = 1400, puntos = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
  puntos.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, fase: Math.random() * 6.283, ambar: Math.random() < 0.045 });
}
const ESTADOS = {
  reposo:     { energia: 0.04, giro: 0.12, tam: 1.00, anillo: 0 },
  escuchando: { energia: 0.22, giro: 0.30, tam: 1.10, anillo: 0 },
  pensando:   { energia: 0.10, giro: 1.10, tam: 0.94, anillo: 1 },
  hablando:   { energia: 0.16, giro: 0.35, tam: 1.04, anillo: 0 },
};
let modo = "reposo", act = { ...ESTADOS.reposo }, nivelVoz = 0, angulo = 0, t0 = performance.now();

function cuadro(ahora) {
  const t = (ahora - t0) / 1000, dt = Math.min(0.05, (ahora - (cuadro.prev || ahora)) / 1000); cuadro.prev = ahora;
  const meta = ESTADOS[modo];
  for (const k in act) act[k] += (meta[k] - act[k]) * Math.min(1, dt * 3.5);
  if (modo === "hablando") nivelVoz = Math.max(nivelVoz * 0.92, 0.35 + 0.65 * Math.abs(Math.sin(t * 7.3) * Math.sin(t * 3.1)));
  else nivelVoz *= 0.9;
  angulo += dt * act.giro;

  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34 * act.tam * (1 + 0.025 * Math.sin(t * 1.6));
  const halo = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.6);
  halo.addColorStop(0, `rgba(245,158,11,${0.10 + nivelVoz * 0.12 + act.anillo * 0.06})`);
  halo.addColorStop(1, "rgba(245,158,11,0)");
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);

  const cY = Math.cos(angulo), sY = Math.sin(angulo), inc = -0.35 + 0.08 * Math.sin(t * 0.4), cX = Math.cos(inc), sX = Math.sin(inc);
  const lista = [];
  for (const p of puntos) {
    const ola = act.energia * Math.sin(p.fase + t * (modo === "escuchando" ? 6 : 3) + p.y * 5)
              + (modo === "hablando" ? nivelVoz * 0.16 * Math.sin(p.y * 9 + t * 11) : 0);
    const k = 1 + ola;
    let x = p.x * k, y = p.y * k, z = p.z * k;
    const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
    const y1 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;
    lista.push([x1, y1, z2, p.ambar]);
  }
  lista.sort((a, b) => a[2] - b[2]);
  for (const [x, y, z, ambar] of lista) {
    const prof = (z + 1) / 2, tam = 0.5 + prof * 1.7;
    ctx.fillStyle = ambar ? `rgba(251,191,36,${0.35 + prof * 0.65})` : `rgba(250,250,250,${0.08 + prof * 0.82})`;
    ctx.beginPath(); ctx.arc(cx + x * R, cy + y * R, ambar ? tam * 1.5 : tam, 0, 6.283); ctx.fill();
  }
  if (act.anillo > 0.02) {
    for (let i = 0; i < 90; i++) {
      const a = (i / 90) * 6.283 + t * 1.8, rr = R * (1.32 + 0.03 * Math.sin(i * 3 + t * 4));
      ctx.fillStyle = `rgba(251,191,36,${act.anillo * (0.25 + 0.6 * ((i % 9) / 9))})`;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.32, 1.4, 0, 6.283); ctx.fill();
    }
  }
  requestAnimationFrame(cuadro);
}

function ponerModo(m, texto) {
  modo = m;
  $("estado").textContent = texto;
  $("estado").classList.toggle("vivo", m !== "reposo");
}

// ---------- Texto con lo importante resaltado ----------
const escapar = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const resaltar = (s) => escapar(s).replace(/(\$\s?[\d.,]+|\b\d[\d.,]*\s(?:mil(?:\s(?:pesos))?|pesos|d[ií]as?|horas?|millones|mill[oó]n)\b|\b(?:hoy|mañana)\b)/gi, "<b>$1</b>");

// ---------- Voz ----------
let conVoz = leer("conVoz", true), vozElegida = null, audioListo = false;
function pintarVoz() { $("voz").classList.toggle("activo", conVoz); $("ondasVoz").style.opacity = conVoz ? 1 : 0; }
function elegirVoz() {
  const orden = ["es-co", "es-mx", "es-us", "es-419", "es-es"];
  const v = speechSynthesis.getVoices().filter((x) => x.lang.toLowerCase().startsWith("es"));
  v.sort((a, b) => ((orden.indexOf(a.lang.toLowerCase()) + 99) % 99) - ((orden.indexOf(b.lang.toLowerCase()) + 99) % 99));
  vozElegida = v[0] || null;
}
if ("speechSynthesis" in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

// iPhone: la voz solo arranca después de un toque. Además se reproduce un audio mudo para que el
// teléfono trate la app como "reproduciendo audio" y no la calle el botón de silencio.
function prepararAudio() {
  if (audioListo) return; audioListo = true;
  try {
    const mudo = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=");
    mudo.loop = true; mudo.volume = 0.01; mudo.setAttribute("playsinline", ""); mudo.play().catch(() => {});
  } catch {}
  if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
}
function hablar(texto) {
  if (!conVoz || !("speechSynthesis" in window)) { ponerModo("reposo", "Toca la esfera para hablar"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = vozElegida ? vozElegida.lang : "es-CO"; if (vozElegida) u.voice = vozElegida; u.rate = 1.05;
  u.onstart = () => ponerModo("hablando", "Hablando");
  u.onboundary = () => { nivelVoz = 1; };
  u.onend = u.onerror = () => ponerModo("reposo", "Toca la esfera para hablar");
  speechSynthesis.speak(u);
  setTimeout(() => { if (modo !== "hablando" && !speechSynthesis.speaking) ponerModo("reposo", "Toca la esfera para hablar"); }, 1500);
}

// ---------- Hablar con el cerebro ----------
let historial = leer("historial", []), ocupado = false;
async function preguntar(texto) {
  texto = texto.trim();
  if (!texto || ocupado) return;
  if (!clave()) return pedirConexion();
  ocupado = true;
  $("respuesta").innerHTML = `<span class="tu">${escapar(texto)}</span>`;
  ponerModo("pensando", "Pensando…");
  let resp, error = false;
  try {
    const r = await fetch(URL_MINISTRO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: clave(), texto }) });
    resp = await r.text();
    if (r.status === 401) { guardar("clave", null); resp = "Perdí la conexión. Abre otra vez el link del correo."; error = true; }
    else if (!r.ok) { resp = "Tuve un problema pensando. Intenta otra vez."; error = true; }
  } catch { resp = "No me pude conectar. Revisa el internet."; error = true; }
  ocupado = false;
  $("respuesta").innerHTML = `<span class="tu">${escapar(texto)}</span>${resaltar(resp)}`;
  historial.push({ tu: texto, el: resp }); historial = historial.slice(-50); guardar("historial", historial);
  if (error) ponerModo("reposo", "Toca la esfera para hablar"); else { hablar(resp); cargarEstado(); }
}

// ---------- Escuchar ----------
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false;
if (Reconocer) {
  rec = new Reconocer(); rec.lang = "es-CO"; rec.interimResults = true; rec.continuous = false;
  let final = "";
  rec.onstart = () => { escuchando = true; final = ""; ponerModo("escuchando", "Te escucho…"); };
  rec.onresult = (e) => {
    let parcial = "";
    for (const r of e.results) { if (r.isFinal) final = r[0].transcript; else parcial += r[0].transcript; }
    $("respuesta").innerHTML = `<span class="tu">${escapar(final || parcial)}</span>`;
  };
  rec.onerror = (e) => {
    escuchando = false;
    ponerModo("reposo", e.error === "not-allowed" ? "Activa el micrófono en Ajustes o usa el teclado" : "No te escuché. Toca otra vez");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") abrirTeclado();
  };
  rec.onend = () => { escuchando = false; if (final) preguntar(final); else if (modo === "escuchando") ponerModo("reposo", "Toca la esfera para hablar"); };
}
lienzo.addEventListener("click", () => {
  prepararAudio();
  if (ocupado) return;
  if ("speechSynthesis" in window && speechSynthesis.speaking) { speechSynthesis.cancel(); ponerModo("reposo", "Toca la esfera para hablar"); return; }
  if (!rec) { abrirTeclado(); return; }
  if (escuchando) rec.stop(); else { try { rec.start(); } catch {} }
});

// ---------- Teclado ----------
function abrirTeclado() { $("escribir").classList.add("abierto"); $("teclado").style.display = "none"; $("campo").focus(); }
$("teclado").onclick = () => { prepararAudio(); abrirTeclado(); };
$("escribir").onsubmit = (e) => {
  e.preventDefault(); prepararAudio();
  const t = $("campo").value; $("campo").value = ""; $("campo").blur();
  $("escribir").classList.remove("abierto"); $("teclado").style.display = "";
  preguntar(t);
};

// ---------- Historial ----------
function pintarHistorial() {
  $("lista").innerHTML = historial.length
    ? historial.map((h) => `<p class="tu">${escapar(h.tu)}</p><p>${resaltar(h.el)}</p>`).join("")
    : '<div class="vacio">Todavía no han hablado.</div>';
  $("lista").scrollTop = $("lista").scrollHeight;
}
$("abrirHistorial").onclick = () => { pintarHistorial(); $("historial").classList.add("abierto"); };
$("cerrarHistorial").onclick = () => $("historial").classList.remove("abierto");
$("limpiar").onclick = () => { historial = []; guardar("historial", historial); pintarHistorial(); };
$("voz").onclick = () => { conVoz = !conVoz; guardar("conVoz", conVoz); pintarVoz(); if (conVoz) prepararAudio(); else speechSynthesis.cancel(); };

// ---------- Datos del día ----------
const plata = (n) => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString("es-CO");
const hora12 = (h) => { const [a, b] = h.split(":").map(Number); return `${((a + 11) % 12) + 1}:${String(b).padStart(2, "0")}`; };
async function cargarEstado() {
  if (!clave()) return;
  try {
    const r = await fetch(URL_MINISTRO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clave: clave(), modo: "estado" }) });
    if (r.status === 401) { guardar("clave", null); return pedirConexion(); }
    const d = await r.json();
    const ahora = new Date().toTimeString().slice(0, 5);
    const proxima = d.clases.find((c) => c.hora >= ahora) || d.clases[d.clases.length - 1];
    $("datoHoy").textContent = proxima ? `${hora12(proxima.hora)} ${proxima.tipo === "trabajo" ? "Club" : proxima.titulo}` : "Día libre";
    const e = d.entregas[0];
    const corto = e ? e.titulo.replace(/^(taller|proyecto|entrega)(\s+de)?\s+/i, "") : "";
    $("datoEntrega").textContent = e ? `${e.dias === 0 ? "Hoy" : e.dias === 1 ? "Mañana" : e.dias + " días"} · ${corto.charAt(0).toUpperCase() + corto.slice(1)}` : "Nada";
    $("datoEntrega").classList.toggle("alerta", !!e && e.dias <= 7);
    $("datoSaldo").textContent = plata(d.saldo);
    guardar("estado", d);
  } catch {}
}

function saludar() {
  const h = new Date().getHours();
  const s = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
  const f = new Date().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
  $("saludo").textContent = `${s}, Andrés · ${f}`;
}

medir(); pintarVoz(); saludar(); requestAnimationFrame(cuadro);
if (!clave()) pedirConexion(); else cargarEstado();
const ultima = historial[historial.length - 1];
if (ultima) $("respuesta").innerHTML = resaltar(ultima.el);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
